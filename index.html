<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protect Broccoli</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: #050810;
        background-image: url("/assets/galaxy-bg.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }

      #app {
        position: absolute;
        top: 50%;
        left: 42%;
        transform: translate(-50%, -50%);
        width: min(calc(96vh * 960 / 640), 96vw);
        aspect-ratio: 960 / 640;
        overflow: hidden;
        border: 2px solid rgba(232, 208, 144, 0.55);
        box-shadow:
          0 0 0 1px rgba(10, 8, 16, 0.7),
          0 18px 60px rgba(0, 0, 0, 0.55),
          0 0 48px rgba(255, 224, 130, 0.12);
        background: #0b1410;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
